# Builds the site and deploys it to the Cloudflare Pages project `spark-v2` (justspark.fun) on every push to main.
# The project was created by direct upload, which Cloudflare cannot link to Git, so the deploy runs here with wrangler.
#
# Needs, in the repository settings:
#   - variable CLOUDFLARE_ACCOUNT_ID
#   - secret   CLOUDFLARE_API_TOKEN (Cloudflare API token with Account > Cloudflare Pages > Edit)
# HELIUS_RPC_URL is not needed here: it is only read at runtime from the Pages secret.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set: the site was built but not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name spark-v2
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-message "$(git log -1 --pretty=%s | cut -c1-100)"
          --commit-dirty=true
