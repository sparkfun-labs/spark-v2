# Recomputes token all-time highs (public/ath.json) every 6 hours.
# A commit to main is only made when a value changed; Cloudflare Pages then redeploys the site.

name: Update token ATH

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ath
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/update-ath.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/ath.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ath.json
          git commit -m "Update token ATH"
          git push
